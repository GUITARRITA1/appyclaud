        }

        table {

        }

        .no-entregado {
            background-color: #f8d7da;
            color: #721c24;
            cursor: pointer;
        }

        .entregado:hover, .no-entregado:hover {
            opacity: 0.8;
            transform: scale(1.02);
        }

        .loading, .error {
            text-align: center;
            padding: 2rem;
            font-size: 1.2rem;
        }

        .loading {
            color: #28a745;
        }

        .error {
            color: #dc3545;
        }

            background: #f8f9fa;
            font-size: 0.9rem;
            color: #666;
        }

        .check {
            font-size: 1.3rem;
        }

        /* Modal para mostrar correcciones */
        .modal {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-color: rgba(0,0,0,0.5);
            z-index: 1000;
            justify-content: center;
            align-items: center;
        }
        .modal-content {
            background-color: white;
            padding: 20px;
            border-radius: 12px;
            max-width: 500px;
            width: 90%;
            box-shadow: 0 4px 20px rgba(0,0,0,0.3);
            position: relative;
        }
        .modal-header {
            border-bottom: 2px solid #28a745;
            padding-bottom: 10px;
            margin-bottom: 15px;
            display: flex;
            justify-content: space-between;
            align-items: center;

            margin: 0;
            color: #333;
        }
        .modal-close {
            cursor: pointer;
            font-size: 24px;
            font-weight: bold;
            color: #999;
        }
        .modal-close:hover {
            color: #333;
        }
        .modal-body {
            margin-bottom: 20px;
            line-height: 1.5;
        }
        .modal-footer {
            text-align: right;
        }
        .modal-footer button {
            background-color: #28a745;
            color: white;
            border: none;
            padding: 8px 16px;
            border-radius: 6px;
            cursor: pointer;
        }
        .modal-footer button:hover {
            background-color: #1e7e34;

            font-size: 0.95rem;

            }
            h1 {
                font-size: 1.3rem;
                padding: 1rem;
            }
            .check {
                font-size: 1rem;
            }
        }

        // Función para obtener corrección de un alumno y tipo
        function obtenerCorreccion(alumno, tipo) {
            if (correcciones[alumno] && correcciones[alumno][tipo]) {
                let texto = correcciones[alumno][tipo];
                if (texto !== "xxx") {
                    return texto;
                }
            }
            return "📝 Sin correcciones registradas para este trabajo. Revisar manualmente.";
        }

        // Funciones del modal
        function mostrarModal(alumno, tipo, entregado) {
            const modal = document.getElementById('correccionModal');
            const modalAlumno = document.getElementById('modalAlumno');
            const modalTipo = document.getElementById('modalTipo');
            const modalCorreccion = document.getElementById('modalCorreccion');
            
            modalAlumno.textContent = alumno;
            modalTipo.textContent = tipo;
            
            let correccion = obtenerCorreccion(alumno, tipo);
            let estado = entregado ? "✅ ENTREGADO" : "❌ NO ENTREGADO";
            
            modalCorreccion.innerHTML = `<strong>Estado:</strong> ${estado}<br><br><strong>📝 Corrección/Comentario:</strong><br>${correccion}`;
            
            modal.style.display = "flex";
        }

        function cerrarModal() {
            document.getElementById('correccionModal').style.display = "none";
        }

        // Cerrar modal al hacer click fuera del contenido
        window.onclick = function(event) {
            const modal = document.getElementById('correccionModal');
            if (event.target === modal) {
                cerrarModal();
            }
        }

        async function cargarEntregas() {
            const tbody = document.getElementById('cuerpoTabla');
            const contador = document.getElementById('contador');
            
            try {
                const { data: entregas, error } = await supabaseClient
                    .from('entregas')
                    .select('nombre_alumno, tipo');
                
                if (error) throw error;
                
                console.log("Datos de Supabase:", entregas);
                
                // Crear mapa de entregas
                const entregasMap = {};
                alumnos.forEach(alumno => {
                    entregasMap[alumno] = {};
                    tiposEsperados.forEach(tipo => {
                        entregasMap[alumno][tipo] = false;
                    });
                });
                
                // Marcar entregas
                entregas.forEach(entrega => {
                    const alumnoOriginal = entrega.nombre_alumno?.trim().toUpperCase();
                    const tipoOriginal = entrega.tipo?.trim();
                    
                    if (alumnos.includes(alumnoOriginal) && tiposEsperados.includes(tipoOriginal)) {
                        entregasMap[alumnoOriginal][tipoOriginal] = true;
                    }
                });
                
                // Contar entregas
                let totalEntregas = 0;
                for (const alumno in entregasMap) {
                    for (const tipo in entregasMap[alumno]) {
                        if (entregasMap[alumno][tipo]) totalEntregas++;
                    }
                }
                contador.textContent = `📋 ${alumnos.length} alumnos | ✅ ${totalEntregas} entregas | 🖱️ Click en ✅ o ❌ para ver corrección`;
                
                // Generar tabla
                tbody.innerHTML = '';
                alumnos.forEach((alumno, idx) => {
                    const row = tbody.insertRow();
                    row.insertCell(0).textContent = idx + 1;
                    
                    const celdaAlumno = row.insertCell(1);
                    celdaAlumno.textContent = alumno;
                    celdaAlumno.style.textAlign = 'left';
                    celdaAlumno.style.fontWeight = 'bold';
                    
                    tiposEsperados.forEach(tipo => {
                        const celda = row.insertCell();
                        const entregado = entregasMap[alumno][tipo];
                        
                        if (entregado) {
                            celda.innerHTML = '<span class="check">✅</span>';
                            celda.className = 'entregado';
                        } else {
                            celda.innerHTML = '❌';
                            celda.className = 'no-entregado';
                        }
                        
                        // Agregar evento click a la celda
                        celda.style.cursor = 'pointer';
                        celda.onclick = (function(a, t, e) {
                            return function() { mostrarModal(a, t, e); };
                        })(alumno, tipo, entregado);
                    });
                });
                
            } catch (error) {
                console.error('Error:', error);
                tbody.innerHTML = `<tr><td colspan="14" class="error">❌ Error: ${error.message}</td></tr>`;
                contador.textContent = '⚠️ Error de conexión';
            }
        }
        
        cargarEntregas();
    </script>
</body>
</html>
